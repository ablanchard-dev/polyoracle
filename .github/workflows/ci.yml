name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stack comes up from a fresh clone, without a .env
        # Le point du test : un clone neuf n'a pas de .env. On ne le cree pas ici,
        # sinon on ne testerait pas ce que vit la personne qui clone le repo.
        run: |
          docker compose up -d --build backend
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8000/health >/dev/null && break || sleep 2
          done
          curl -sf http://localhost:8000/health
          docker compose down -v
      - name: Frontend image builds
        run: docker compose build frontend
